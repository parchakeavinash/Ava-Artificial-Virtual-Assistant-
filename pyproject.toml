[project]
name = "ava"
version = "0.1.0"
description = "Ava Voice Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "assemblyai>=1.0.0",
    "av>=17.1.0",
    "elevenlabs>=2.64.0",
    "fastapi>=0.141.1",
    "firecrawl-py>=4.38.0",
    "google-genai>=2.19.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.0.0",
    "numpy>=2.5.2",
    "ollama>=0.6.2",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sarvamai>=0.1.30",
    "streamlit>=1.62.0",
    "streamlit-webrtc>=0.77.0",
    "uvicorn>=0.52.4",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

